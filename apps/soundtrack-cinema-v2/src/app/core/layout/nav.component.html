<nav role="navigation" aria-label="Main navigation" class="nav">
  <div class="nav-inner">
    <a class="nav-brand" routerLink="/" aria-label="Soundtrack Cinema — go to home">
      🎬 Soundtrack Cinema
    </a>

    <div class="nav-actions">
      @if (isAuthenticated()) {
        <ul class="nav-links" role="list">
          <li><a routerLink="/">Home</a></li>
          <li><a routerLink="/playlist">Playlists</a></li>
        </ul>

        @if (user(); as u) {
          <div class="nav-user" aria-label="Logged in as {{ u.display_name ?? u.id }}">
            @if (u.images[0]; as img) {
              <img
                class="nav-avatar"
                [src]="img.url"
                [alt]="u.display_name ?? u.id"
                width="32"
                height="32"
              />
            } @else {
              <span class="nav-avatar-placeholder" aria-hidden="true">
                {{ (u.display_name ?? u.id).charAt(0).toUpperCase() }}
              </span>
            }
            <span class="nav-username">{{ u.display_name ?? u.id }}</span>
          </div>
        }

        <button class="btn btn-ghost btn-sm" type="button">Logout</button>
      } @else {
        <button class="btn btn-spotify" type="button">
          Connect Spotify
        </button>
      }
    </div>
  </div>
</nav>
